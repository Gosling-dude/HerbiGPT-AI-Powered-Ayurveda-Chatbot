name: Deploy backend and configure Netlify

on:
  push:
    branches:
      - deploy/backend-ready
  workflow_dispatch: {}

jobs:
  deploy-render:
    name: Trigger Render deploy (if secrets present)
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy
        env:
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          if [ -z "$RENDER_SERVICE_ID" ] || [ -z "$RENDER_API_KEY" ]; then
            echo "RENDER_SERVICE_ID or RENDER_API_KEY missing. Skipping Render deploy.";
            exit 0;
          fi
          echo "Triggering Render deploy for service: $RENDER_SERVICE_ID"
          curl -s -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":true}' | jq || true
      - name: Short pause
        run: sleep 12

  set-netlify-env:
    name: Set Netlify environment variable REACT_APP_API_URL
    needs: deploy-render
    runs-on: ubuntu-latest
    steps:
      - name: Update Netlify ENV var (if secrets present)
        env:
          NETLIFY_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          if [ -z "$NETLIFY_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "NETLIFY_AUTH_TOKEN or NETLIFY_SITE_ID missing. Skipping Netlify env update.";
            exit 0;
          fi
          if [ -z "$BACKEND_URL" ]; then
            echo "BACKEND_URL secret not set. Please set it to your deployed backend URL or update Netlify UI manually.";
            exit 0;
          fi
          echo "Setting REACT_APP_API_URL to $BACKEND_URL on Netlify site $NETLIFY_SITE_ID"
          curl -s -X PATCH "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID" \
            -H "Authorization: Bearer $NETLIFY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"build_settings\":{\"env\":{\"REACT_APP_API_URL\":\"$BACKEND_URL\"}}}" | jq || true
