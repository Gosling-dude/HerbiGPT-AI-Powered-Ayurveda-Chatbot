name: Deploy to Google Cloud Platform

on:
  push:
    branches:
      - main
      - deploy/gcp
  workflow_dispatch: {}

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  BACKEND_SERVICE_NAME: herbigpt-backend
  ARTIFACT_REGISTRY_REPO: herbigpt-repo
  FRONTEND_BUCKET_NAME: ${{ secrets.GCP_FRONTEND_BUCKET }}
  CDN_LOAD_BALANCER_NAME: herbigpt-lb

jobs:
  deploy-backend:
    name: Build & Deploy Backend to Cloud Run
    runs-on: ubuntu-latest
    if: "${{ secrets.GCP_PROJECT_ID != '' }}"
    outputs:
      backend_url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCP Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Backend Docker Image
        run: |
          IMAGE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/${{ env.BACKEND_SERVICE_NAME }}:${{ github.sha }}"
          docker build -t $IMAGE_TAG ./backend
          docker push $IMAGE_TAG

      - name: Deploy Backend to Cloud Run
        id: deploy
        run: |
          IMAGE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/${{ env.BACKEND_SERVICE_NAME }}:${{ github.sha }}"
          
          # Deploy with Secret Manager links for GROQ_API_KEY and GOOGLE_API_KEY
          gcloud run deploy ${{ env.BACKEND_SERVICE_NAME }} \
            --image=$IMAGE_TAG \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --update-secrets=GROQ_API_KEY=GROQ_API_KEY:latest,GOOGLE_API_KEY=GOOGLE_API_KEY:latest \
            --update-env-vars=NODE_ENV=production,LOG_LEVEL=info

          # Capture service URL
          URL=$(gcloud run services describe ${{ env.BACKEND_SERVICE_NAME }} --region=${{ env.REGION }} --format='value(status.url)')
          echo "url=$URL" >> $GITHUB_OUTPUT

  deploy-frontend:
    name: Build & Deploy Frontend to GCS & CDN
    needs: deploy-backend
    runs-on: ubuntu-latest
    if: "${{ secrets.GCP_PROJECT_ID != '' && needs.deploy-backend.outputs.backend_url != '' }}"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend React App
        working-directory: ./frontend
        env:
          REACT_APP_API_URL: ${{ needs.deploy-backend.outputs.backend_url }}
          CI: false
        run: npm run build

      - name: Upload Static Assets to Google Cloud Storage
        run: |
          # Sync build files to bucket
          gsutil -m rsync -r -d ./frontend/build gs://${{ env.FRONTEND_BUCKET_NAME }}
          
          # Make assets public-readable
          gsutil -m acl ch -R -g all:R gs://${{ env.FRONTEND_BUCKET_NAME }}
          
          # Configure website index and error documents
          gsutil web set -m index.html -e index.html gs://${{ env.FRONTEND_BUCKET_NAME }}

      - name: Invalidate Cloud CDN Cache (optional)
        run: |
          # Invalidate load balancer CDN cache for quick asset updates
          gcloud compute url-maps invalidate-cache ${{ env.CDN_LOAD_BALANCER_NAME }} \
            --path="/*" \
            --async || true
